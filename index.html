<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="滚动驱动的 3D 科普体验:从茹毛饮血到智能生活,沿垂直时间柱下降浏览人类生活方式的变迁。"
    />
    <link rel="icon" href="data:," />
    <title>人类生活方式的变迁 · 3D 科普</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0a0c12;
        color: #e8ecf2;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          'Microsoft YaHei',
          sans-serif;
      }
      html {
        scroll-behavior: auto;
      }
      #app {
        position: fixed;
        inset: 0;
        z-index: 1;
      }
      #app canvas {
        display: block;
      }
      #ui-root {
        position: fixed;
        inset: 0;
        z-index: 10;
        pointer-events: none;
      }
      /* 轻微暗角:把注意力收到画面中心 */
      #vignette {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background: radial-gradient(
          ellipse at 50% 46%,
          rgba(0, 0, 0, 0) 42%,
          rgba(0, 0, 0, 0.26) 74%,
          rgba(0, 0, 0, 0.55) 100%
        );
      }
      /* 800vh 的滚动行程:前 6% 序章 + 7 段时代 + 尾声 */
      #scroll-spacer {
        height: 800vh;
        z-index: 0;
        pointer-events: none;
      }
      #loading {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0c12;
        color: #7d8798;
        font-size: 14px;
        letter-spacing: 0.24em;
        transition: opacity 0.6s ease;
      }
      #loading.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="vignette"></div>
    <div id="ui-root"></div>
    <div id="scroll-spacer"></div>
    <div id="loading">正在构筑历史长河…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
